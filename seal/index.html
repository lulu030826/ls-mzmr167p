<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Seal">
  <meta name="description" content="Private notes vault for your iPhone. Encrypted on device.">
  <title>Seal</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <section id="gate" class="gate" aria-label="Unlock Seal">
    <div class="gate-inner">
      <p class="brand">Seal</p>
      <h1 class="headline">Your private vault.</h1>
      <p class="lede">Notes stay encrypted on this phone. Nothing leaves without your passphrase.</p>
      <form id="unlock-form" class="unlock" autocomplete="off">
        <label class="field">
          <span class="field-label">Passphrase</span>
          <input
            id="passphrase"
            name="passphrase"
            type="password"
            enterkeyhint="go"
            autocomplete="current-password"
            spellcheck="false"
            required
            minlength="8"
            placeholder="At least 8 characters"
          >
        </label>
        <div class="cta-row">
          <button type="submit" class="btn primary" id="unlock-btn">Unlock</button>
        </div>
        <p class="hint" id="gate-hint"></p>
      </form>
    </div>
  </section>

  <section id="vault" class="vault" hidden aria-label="Vault">
    <header class="topbar">
      <div>
        <p class="brand tiny">Seal</p>
        <p class="who" id="status-line">Unlocked on this device</p>
      </div>
      <button type="button" class="btn icon" id="lock-btn" aria-label="Lock vault">Lock</button>
    </header>

    <div class="composer">
      <label class="field">
        <span class="field-label">New note</span>
        <textarea id="note-body" rows="3" placeholder="Write something only you should see…" maxlength="4000"></textarea>
      </label>
      <button type="button" class="btn primary" id="save-btn">Save note</button>
    </div>

    <div class="list-head">
      <h2>Notes</h2>
      <span id="note-count">0</span>
    </div>
    <ul id="note-list" class="note-list"></ul>
    <p class="empty" id="empty-state" hidden>No notes yet. Your first one stays sealed on this phone.</p>
  </section>

  <script src="app.js" type="module"></script>
</body>
</html>
