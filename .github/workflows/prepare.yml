name: prepare
on:
  push:
    branches: [main]
    paths:
      - "**/*.b64"
      - ".github/workflows/prepare.yml"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: prepare
  cancel-in-progress: false
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 assets
        run: |
          set -euo pipefail
          count=$(find . -name '*.b64' | wc -l)
          echo "found $count b64 files"
          find . -name '*.b64' | while read -r f; do
            dest="${f%.b64}"
            mkdir -p "$(dirname "$dest")"
            base64 -d "$f" > "$dest"
            rm -f "$f"
            echo "decoded $dest ($(wc -c < "$dest") bytes)"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Restore binary media and fonts"
            git push
          fi
      - name: Stage Pages directory
        run: |
          set -euo pipefail
          mkdir -p _publish
          rsync -a --exclude '.git/' --exclude '.github/' --exclude '_publish/' --exclude 'README.md' --exclude '*.b64' ./ _publish/
          test -f _publish/index.html
          test -f _publish/.nojekyll
          test -f _publish/media/pre-wedding.mp4
          ls -la _publish/media | head
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: _publish
      - uses: actions/deploy-pages@v4
        continue-on-error: true
        id: deployment
