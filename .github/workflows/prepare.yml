name: prepare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  decode:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 assets
        run: |
          set -euo pipefail
          count=$(find . -name '*.b64' | wc -l)
          echo "found $count b64 files"
          if [ "$count" -gt 0 ]; then
            find . -name '*.b64' | while read -r f; do
              dest="${f%.b64}"
              mkdir -p "$(dirname "$dest")"
              base64 -d "$f" > "$dest"
              rm -f "$f"
              echo "decoded $dest ($(wc -c < "$dest") bytes)"
            done
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              echo "no changes"
            else
              git commit -m "Restore binary media and fonts"
              git push
            fi
          fi
      - name: Stage Pages directory
        run: |
          set -euo pipefail
          mkdir -p _publish
          rsync -a --exclude '.git/' --exclude '.github/' --exclude '_publish/' --exclude 'README.md' --exclude '*.b64' ./ _publish/
          test -f _publish/index.html
          test -f _publish/.nojekyll
          test -f _publish/media/pre-wedding.mp4
          test -f _publish/media/wedding-kiss.jpg
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _publish
      - uses: actions/deploy-pages@v4
        id: deployment
